MODEL:
  NAME: transformer
  DEVICE: cuda
  PRETRAIN_PATH: ""
  PRETRAIN_CHOICE: "imagenet"

  LAST_STRIDE: 1
  STRIDE_SIZE: [16, 16]

  TRANSFORMER_TYPE: vit_base_patch16_224_TransReID

  JPM: True
  SHIFT_NUM: 5
  SHUFFLE_GROUP: 2
  DEVIDE_LENGTH: 4

  SIE_CAMERA: False
  SIE_VIEW: False
  SIE_COE: 3.0

  DROP_PATH: 0.1
  DROP_OUT: 0.0
  ATT_DROP_RATE: 0.0

  ID_LOSS_TYPE: softmax
  METRIC_LOSS_TYPE: triplet
  NO_MARGIN: False
  IF_LABELSMOOTH: "on"
  COS_LAYER: False

  NECK: bnneck
  FEAT_NORM: True

INPUT:
  SIZE_TRAIN: [224, 224]
  SIZE_TEST: [224, 224]
  PROB: 0.5
  RE_PROB: 0.5
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

TEST:
  NECK_FEAT: after
  FEAT_NORM: True
  RE_RANKING: False

SOLVER:
  OPTIMIZER_NAME: Adam
  MAX_EPOCHS: 120
  BASE_LR: 0.0003
  BIAS_LR_FACTOR: 1
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0005
  WEIGHT_DECAY_BIAS: 0.0005
  GAMMA: 0.1
  STEPS: [40, 70]
  WARMUP_FACTOR: 0.01
  WARMUP_EPOCHS: 5
  WARMUP_METHOD: linear
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 100
  EVAL_PERIOD: 10
  IMS_PER_BATCH: 64

DATALOADER:
  SAMPLER: softmax
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

DATASETS:
  NAMES: ("VeRi")
  ROOT_DIR: "./data"

OUTPUT_DIR: "./logs"